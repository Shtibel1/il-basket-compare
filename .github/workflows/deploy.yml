name: Update prices and deploy

# Runs on forks and repos created from the template with no secrets:
# enable Pages (Settings → Pages → Source: GitHub Actions) and run it once.
on:
  schedule:
    - cron: "0 4 * * *"   # daily, ~07:00 Israel time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site.config.json", "web/**", "pricecompare/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # The upstream repo publishes the nationwide site (every city, with a city
      # picker). Repos created from the template publish their own city, unless
      # they set the repository variable HOSTED to true.
      HOSTED: ${{ github.repository == 'Shtibel1/il-basket-compare' || vars.HOSTED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # Nationwide site: every chain's branches and prices, one data file per city.
      - name: Download every city's prices
        if: env.HOSTED == 'true'
        run: python -m pricecompare national --out web/data
      - name: Render the nationwide site
        if: env.HOSTED == 'true'
        run: |
          python -m pricecompare render --hosted --out dist
          du -sh dist
          if [ -n "$(find dist -size +95M)" ]; then echo "a file is over the Pages limit"; exit 1; fi

      # Single-city site (template forks).
      # Yesterday's snapshot lets stores whose new file isn't out yet keep their prices.
      - name: Restore the previous price snapshot
        if: env.HOSTED != 'true'
        uses: actions/cache/restore@v4
        with:
          path: web/data.json
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - name: Download today's prices
        if: env.HOSTED != 'true'
        run: python -m pricecompare update
      - if: env.HOSTED != 'true'
        uses: actions/cache/save@v4
        with:
          path: web/data.json
          key: prices-${{ github.run_id }}
      - name: Thumbnails cache (only used when images are on)
        if: env.HOSTED != 'true'
        uses: actions/cache@v4
        with:
          path: .cache/thumbs
          key: thumbs-${{ github.run_id }}
          restore-keys: thumbs-
      - if: env.HOSTED != 'true'
        run: python -m pricecompare images
      - if: env.HOSTED != 'true'
        run: python -m pricecompare render --out dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
